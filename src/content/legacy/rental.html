<p>本記事は、ライバー様へ配信端末を貸与する際の手続きと案内内容を記載したものです。</p><h2 id="s1">貸与の流れ</h2><p>端末の貸与は、以下の流れで実施いたします。</p><ol class="step-list"><li><p class="step-title">テンプレートメッセージから申請URLを送付</p><figure class="shot"><img src="/rental/image-2-1024x551.png" alt="テンプレートメッセージから申請URLを送付の画像" width="1024" height="551" loading="lazy" decoding="async"></figure><figure class="shot"><img src="/rental/image-3.png" alt="テンプレートメッセージから申請URLを送付の画像" width="548" height="172" loading="lazy" decoding="async"></figure></li><li><p class="step-title">ライバーが必要情報を入力して申請</p><figure class="shot"><img src="/rental/image-4.png" alt="ライバーが必要情報を入力して申請の画像" width="730" height="332" loading="lazy" decoding="async"></figure></li><li><p class="step-title">契約書を送付</p><p>テンプレート「設備賃貸借契約書」をの最新バージョンをお送りください。</p></li><li><p class="step-title">契約締結後、端末を発送</p><p>石原まで、端末発送の依頼をお願いします。</p></li></ol>
